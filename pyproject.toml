[project]
name = "enterprise-sales-copilot"
version = "0.1.0"
description = "Real-time AI sales copilot that detects customer questions and retrieves answers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "deepgram-sdk>=3.7.0,<4",
    "openai>=1.50.0",
    "anthropic>=0.39.0",
    "boto3>=1.35.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.vercel]
entrypoint = "backend.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.77",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "scripts"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.11"
root = ["./backend"]

[tool.ty.src]
exclude = ["scripts/**", "frontend/**", ".venv/**"]
